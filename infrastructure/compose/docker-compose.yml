services:
  postgres:
    image: postgres:16-alpine
    container_name: chronos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHRONOS_DB_NAME:-chronos_core}
      POSTGRES_USER: ${CHRONOS_DB_USERNAME:-chronos_user}
      POSTGRES_PASSWORD: ${CHRONOS_DB_PASSWORD:-chronos_dev_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${CHRONOS_DB_PORT:-5432}:5432"
    volumes:
      - chronos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHRONOS_DB_USERNAME:-chronos_user} -d ${CHRONOS_DB_NAME:-chronos_core}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chronos-network
  redis:
    image: redis:7.2-alpine
    container_name: chronos-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "${CHRONOS_REDIS_PORT:-6379}:6379"
    volumes:
      - chronos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - chronos-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: chronos-prometheus
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - chronos-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: chronos-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=chronos_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - chronos-network

volumes:
  chronos_pgdata:
    name: chronos_pgdata
  chronos_redisdata:
    name: chronos_redisdata

networks:
  chronos-network:
    name: chronos-network
    driver: bridge
