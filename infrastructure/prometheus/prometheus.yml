global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'chronos-coordinator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['chronos-coordinator:8080', 'host.docker.internal:8080']
        labels:
          application: 'chronos-coordinator'
          env: 'production'
