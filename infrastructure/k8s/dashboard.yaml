apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-dashboard
  namespace: chronos-core
  labels:
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: chronoscore/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: chronos-dashboard
  namespace: chronos-core
spec:
  selector:
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
