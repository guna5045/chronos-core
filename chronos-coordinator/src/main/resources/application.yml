spring:
  application:
    name: chronos-coordinator
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CHRONOS_DB_URL:jdbc:postgresql://localhost:5432/chronos_core}
    username: ${CHRONOS_DB_USERNAME:chronos_user}
    password: ${CHRONOS_DB_PASSWORD:chronos_dev_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ChronosCoordinatorHikariCP
      maximum-pool-size: ${CHRONOS_DB_POOL_MAX:10}
      minimum-idle: ${CHRONOS_DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.chronoscore: DEBUG

