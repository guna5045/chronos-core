spring:
  datasource:
    url: jdbc:h2:mem:chronos_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
    clean-disabled: false

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    com.chronoscore: DEBUG

chronos:
  coordination:
    enabled: false
    coordinator-id: test-coordinator-01
    leader-lease-duration: 5s
    leader-renewal-interval: 1500ms
    task-lock-ttl: 30s
  coordinator:
    grpc:
      enabled: false
      port: 0
    cluster:
      enabled: false
  scheduler:
    enabled: false
  distribution:
    virtual-nodes-per-worker: 128
  recovery:
    enabled: false
  lease:
    duration: 30s
    renewal-interval: 10s
  retry:
    enabled: true
    base-delay: 1s
    max-delay: 60s
    multiplier: 2.0
    jitter: false
  security:
    enabled: true
    jwt-secret: chronos-core-distributed-orchestration-dev-secret-key-32bytes-minimum
    issuer: chronos-core
    token-validity-seconds: 3600


