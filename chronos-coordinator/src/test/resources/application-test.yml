spring:
  datasource:
    url: jdbc:h2:mem:chronos_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
    clean-disabled: false

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    com.chronoscore: DEBUG
