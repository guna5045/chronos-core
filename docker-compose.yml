services:
  postgres:
    image: postgres:16-alpine
    container_name: chronos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHRONOS_DB_NAME:-chronos_core}
      POSTGRES_USER: ${CHRONOS_DB_USERNAME:-chronos_user}
      POSTGRES_PASSWORD: ${CHRONOS_DB_PASSWORD:-chronos_dev_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${CHRONOS_DB_PORT:-5432}:5432"
    volumes:
      - chronos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHRONOS_DB_USERNAME:-chronos_user} -d ${CHRONOS_DB_NAME:-chronos_core}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chronos-network

  redis:
    image: redis:7.2-alpine
    container_name: chronos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel notice
    ports:
      - "${CHRONOS_REDIS_PORT:-6379}:6379"
    volumes:
      - chronos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - chronos-network

  chronos-coordinator:
    build:
      context: .
      dockerfile: infrastructure/docker/coordinator.Dockerfile
    container_name: chronos-coordinator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CHRONOS_DB_URL: jdbc:postgresql://postgres:5432/${CHRONOS_DB_NAME:-chronos_core}
      CHRONOS_DB_USERNAME: ${CHRONOS_DB_USERNAME:-chronos_user}
      CHRONOS_DB_PASSWORD: ${CHRONOS_DB_PASSWORD:-chronos_dev_pass}
      CHRONOS_REDIS_HOST: redis
      CHRONOS_REDIS_PORT: 6379
      CHRONOS_JWT_SECRET: ${CHRONOS_JWT_SECRET:-chronos-core-distributed-orchestration-dev-secret-key-32bytes-minimum}
      SPRING_PROFILES_ACTIVE: prod
      CHRONOS_COORDINATOR_GRPC_PORT: 9090
      CHRONOS_AI_ENABLED: ${CHRONOS_AI_ENABLED:-false}
    ports:
      - "${CHRONOS_COORDINATOR_PORT:-8080}:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - chronos-network

  chronos-worker-1:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: chronos-worker-1
    restart: unless-stopped
    depends_on:
      chronos-coordinator:
        condition: service_healthy
    environment:
      CHRONOS_WORKER_ID: worker-1
      CHRONOS_WORKER_HOSTNAME: chronos-worker-1
      CHRONOS_WORKER_PORT: 9091
      CHRONOS_COORDINATOR_HOST: chronos-coordinator
      CHRONOS_COORDINATOR_PORT: 9090
      CHRONOS_WORKER_MAX_CONCURRENCY: 8
    ports:
      - "8081:8081"
    networks:
      - chronos-network

  chronos-worker-2:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: chronos-worker-2
    restart: unless-stopped
    depends_on:
      chronos-coordinator:
        condition: service_healthy
    environment:
      CHRONOS_WORKER_ID: worker-2
      CHRONOS_WORKER_HOSTNAME: chronos-worker-2
      CHRONOS_WORKER_PORT: 9092
      CHRONOS_COORDINATOR_HOST: chronos-coordinator
      CHRONOS_COORDINATOR_PORT: 9090
      CHRONOS_WORKER_MAX_CONCURRENCY: 8
    ports:
      - "8082:8081"
    networks:
      - chronos-network

  chronos-worker-3:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: chronos-worker-3
    restart: unless-stopped
    depends_on:
      chronos-coordinator:
        condition: service_healthy
    environment:
      CHRONOS_WORKER_ID: worker-3
      CHRONOS_WORKER_HOSTNAME: chronos-worker-3
      CHRONOS_WORKER_PORT: 9093
      CHRONOS_COORDINATOR_HOST: chronos-coordinator
      CHRONOS_COORDINATOR_PORT: 9090
      CHRONOS_WORKER_MAX_CONCURRENCY: 8
    ports:
      - "8083:8081"
    networks:
      - chronos-network

  chronos-dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard.Dockerfile
    container_name: chronos-dashboard
    restart: unless-stopped
    depends_on:
      - chronos-coordinator
    ports:
      - "${CHRONOS_DASHBOARD_PORT:-5173}:80"
    networks:
      - chronos-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: chronos-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${CHRONOS_PROMETHEUS_PORT:-9095}:9090"
    networks:
      - chronos-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: chronos-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-chronos_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "${CHRONOS_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - chronos-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: chronos-otel-collector
    restart: unless-stopped
    profiles:
      - observability-otel
    volumes:
      - ./infrastructure/opentelemetry/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - chronos-network

volumes:
  chronos_pgdata:
    name: chronos_pgdata
  chronos_redisdata:
    name: chronos_redisdata

networks:
  chronos-network:
    name: chronos-network
    driver: bridge
