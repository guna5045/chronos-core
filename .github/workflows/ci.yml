name: Chronos Core CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile & Execute Automated Tests
        run: mvn -B clean test

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  frontend-ci:
    name: Frontend Build & Test (TypeScript / React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'chronos-dashboard/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: chronos-dashboard
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: chronos-dashboard
        run: npm test

      - name: Build Production Frontend Assets
        working-directory: chronos-dashboard
        run: npm run build

  docker-build-ci:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Coordinator Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/coordinator.Dockerfile
          push: false
          tags: chronoscore/coordinator:ci
          load: false

      - name: Validate Worker Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/worker.Dockerfile
          push: false
          tags: chronoscore/worker:ci
          load: false

      - name: Validate Dashboard Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/dashboard.Dockerfile
          push: false
          tags: chronoscore/dashboard:ci
          load: false
